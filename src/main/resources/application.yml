spring:
  application:
    name: ticketing
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  spring:
    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          jdbc:
            time_zone: UTC

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  rate-limit:
    enabled: false