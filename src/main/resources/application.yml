spring:
  application:
    name: ticketing
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  spring:
    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          jdbc:
            time_zone: UTC

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  auth:
    secrets:
      cpf-encryption-key: ${CPF_ENCRYPTION_KEY:}
      cpf-hmac-key: ${CPF_HMAC_KEY:}
      jwt-signing-key: ${JWT_SIGNING_KEY:}